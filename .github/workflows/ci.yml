name: RAVEN Continuous Integration & Production Security Pipeline

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

jobs:
  backend-quality-and-security:
    name: Backend Lint, Typecheck & Security Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff mypy httpx alembic prometheus-client

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run MyPy Type Checker
        run: |
          mypy domain events simulator policies tools agents ml apps razorpay tests persistence

      - name: Execute Full Pytest Suite
        run: |
          pytest -v --durations=10

      - name: Verify Alembic Migrations
        run: |
          alembic upgrade head

  frontend-build:
    name: Frontend Next.js Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'apps/dashboard/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd apps/dashboard
          npm ci

      - name: Run Next.js Typecheck & Build
        run: |
          cd apps/dashboard
          npm run build

  docker-build-verification:
    name: Docker Multi-Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend-quality-and-security, frontend-build]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Compose Stack
        run: |
          docker compose build
