services:

  raven-api:
    build: .
    container_name: raven-api
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    environment:
      - RAVEN_ENV=${RAVEN_ENV:-production}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-raven--ai}
      - FIREBASE_CREDENTIALS=${FIREBASE_CREDENTIALS:-firebase_service_account.json}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_placeholder}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-placeholder_secret}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
      - RAVEN_POLICY_SECRET=${RAVEN_POLICY_SECRET:-raven_policy_secret_key_2026}
    volumes:
      - ./firebase_service_account.json:/app/firebase_service_account.json
    command: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  raven-worker:
    build: .
    container_name: raven-worker
    environment:
      - RAVEN_ENV=${RAVEN_ENV:-production}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-raven--ai}
      - FIREBASE_CREDENTIALS=${FIREBASE_CREDENTIALS:-firebase_service_account.json}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_placeholder}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-placeholder_secret}
      - RAVEN_POLICY_SECRET=${RAVEN_POLICY_SECRET:-raven_policy_secret_key_2026}
    volumes:
      - ./firebase_service_account.json:/app/firebase_service_account.json
    healthcheck:
      disable: true
    command: ["python", "-c", "from apps.worker.worker import RecoveryWorker; RecoveryWorker().run_loop()"]

  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    container_name: raven-dashboard
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      - NEXT_PUBLIC_FIREBASE_API_KEY=${NEXT_PUBLIC_FIREBASE_API_KEY:-AIzaSyDALkLqXiMcsBD0Y7Q4Jt17vU-JAs9u_P0}
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-raven--ai.firebaseapp.com}
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-raven--ai}
      - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-raven--ai.firebasestorage.app}
      - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-317062219146}
      - NEXT_PUBLIC_FIREBASE_APP_ID=${NEXT_PUBLIC_FIREBASE_APP_ID:-1:317062219146:web:39f2a33cb203820aa17473}
      - NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID:-G-5VHR471VPC}
    depends_on:
      - raven-api

  ngrok:
    image: ngrok/ngrok:latest
    container_name: raven-ngrok
    restart: unless-stopped
    ports:
      - "${NGROK_HOST_PORT:-4040}:4040"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
      - NGROK_DOMAIN=${NGROK_DOMAIN:-https://darn-coastland-fox.ngrok-free.dev}
    command:
      - "http"
      - "raven-api:8000"
      - "--url=${NGROK_DOMAIN:-https://darn-coastland-fox.ngrok-free.dev}"
      - "--pooling-enabled"
    depends_on:
      - raven-api
